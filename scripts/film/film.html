<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;700&family=Atkinson+Hyperlegible+Next:wght@400;700;800&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; overflow: hidden; background: #0f1113; }
  * { box-sizing: border-box; }
  #stage { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(1400px 900px at 50% 40%, #23272c 0%, #0f1113 70%); }
  .world { position: absolute; left: 0; top: 0; width: 1600px; height: 1000px; transform-origin: 0 0; }
  .world img { position: absolute; inset: 0; width: 1600px; height: 1000px; display: block; }
  .key { position: absolute; left: 0; top: 0; z-index: 21; pointer-events: none; display: flex; align-items: center; justify-content: center; min-width: 96px; height: 96px; padding: 0 26px; background: #f4f5f6; color: #15181b; font: 800 52px/1 "Atkinson Hyperlegible Next", sans-serif; box-shadow: 0 8px 0 #9aa1a8, 0 18px 40px rgba(0,0,0,.45); border-radius: 2px; white-space: nowrap; }
  .key.amber { background: #ffb300; box-shadow: 0 8px 0 #b37d00, 0 18px 40px rgba(0,0,0,.45); }
  #head { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; z-index: 30; pointer-events: none; }
  #head .l { font: 800 112px/1.05 "Atkinson Hyperlegible Next", sans-serif; color: #fff; letter-spacing: -0.02em; white-space: nowrap; }
  #head .s { font: 800 112px/1.05 "Atkinson Hyperlegible Next", sans-serif; color: #ffb300; letter-spacing: -0.02em; margin-top: 10px; white-space: nowrap; }
  #cap { position: absolute; left: 80px; bottom: 72px; z-index: 30; display: flex; align-items: center; gap: 22px; background: #15181b; padding: 22px 34px 24px 28px; max-width: calc(100% - 160px); }
  #cap .dot { width: 18px; height: 18px; background: #ffb300; flex: none; }
  #cap .t { font: 700 52px/1.15 "Atkinson Hyperlegible Next", sans-serif; color: #fff; letter-spacing: -0.01em; }
  #veil { position: absolute; inset: 0; background: #0f1113; z-index: 25; pointer-events: none; }
  #end { position: absolute; inset: 0; z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: #0f1113; padding: 0 60px; }
  #end img { width: 150px; height: 150px; }
  #end .n { font: 800 120px/1 "Atkinson Hyperlegible Next", sans-serif; color: #fff; margin-top: 26px; letter-spacing: -0.02em; }
  #end .s { font: 400 44px/1.3 "Atkinson Hyperlegible Next", sans-serif; color: #d6d9dd; margin-top: 24px; }
  #end .u { font: 700 36px/1 "Atkinson Hyperlegible Mono", monospace; color: #15181b; background: #ffb300; padding: 18px 28px; margin-top: 48px; }
  #end .f { font: 400 28px/1.3 "Atkinson Hyperlegible Next", sans-serif; color: #8b939b; margin-top: 26px; }
  /* 4:5 (LinkedIn): the same film, a taller stage and a wider zoom. */
  .tall #cap { left: 50px; bottom: 60px; max-width: calc(100% - 100px); }
  .tall #cap .t { font-size: 46px; }
  .tall #head .l, .tall #head .s { font-size: 100px; }
</style>
</head>
<body>
<div id="stage">
  <div class="world" id="world"></div>
  <div id="veil"></div>
  <div id="head"><div class="l" id="hl"></div><div class="s" id="hs"></div></div>
  <div id="cap"><div class="dot"></div><div class="t" id="ct"></div></div>
  <div id="end"><img src="shots/icon.png"><div class="n">Cockpit</div><div class="s">Run ten Claude Code sessions. Read none of them.</div><div class="u">getcockpit.github.io</div><div class="f">Free and open source · macOS · Windows · Linux · your own Claude plan</div></div>
</div>
<script>
// Every frame is computed from t (seek); nothing carries between frames, so any frame renders alone.
const TALL = new URLSearchParams(location.search).get("format") === "45";
const W = TALL ? 1080 : 1920, H = TALL ? 1350 : 1080;
document.documentElement.style.width = document.body.style.width = W + "px";
document.documentElement.style.height = document.body.style.height = H + "px";
if (TALL) document.body.classList.add("tall");

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
// Critically damped spring step response, normalised to land exactly on 1 at p = 1.
const spring = (p, w = 7) => { p = clamp(p); const f = (x) => 1 - (1 + w * x) * Math.exp(-w * x); return f(p) / f(1); };
const lerp = (a, b, k) => a + (b - a) * k;
const win = (t, a, b) => clamp((t - a) / (b - a));
const env = (t, a, b, fi = 0.35, fo = 0.3) => Math.min(spring(win(t, a, a + fi)), 1 - spring(win(t, b - fo, b)));

// ---------- the script (MR-139): one morning, one story, every answer a single key ----------
// Scenes: which capture is on screen. Swaps cross-blur over 0.35 s.
const SCENES = [
  { t: 0, img: "calm" }, { t: 2.2, img: "one" }, { t: 5.3, img: "calm" },
  { t: 6.4, img: "focus" }, { t: 9.6, img: "focus-denied" },
  { t: 13.2, img: "settings" }, { t: 15.8, img: "brief" },
  { t: 21.2, img: "doc" }, { t: 28.8, img: "calm" },
];
// Camera, in capture coordinates (1600x1000 CSS px): at t, glide to centre (x, y) at zoom z over d.
const CAM = [
  { t: 0, x: 800, y: 500, z: 1, d: 0.01 },
  { t: 2.4, x: 470, y: 250, z: 1.75, d: 1.1 },        // the one that needs you
  { t: 5.3, x: 800, y: 500, z: 1.0, d: 0.8 },         // answered: the wall is calm again
  { t: 6.4, x: 520, y: 560, z: 1.3, d: 0.01 },        // the risk card
  { t: 6.6, x: 520, y: 570, z: 1.6, d: 1.4 },
  { t: 9.6, x: 520, y: 560, z: 1.6, d: 0.01 },        // Claude's safer plan
  { t: 13.2, x: 560, y: 800, z: 1.7, d: 0.01 },      // "All 211 tests pass."
  { t: 14.4, x: 420, y: 330, z: 1.5, d: 1.0 },        // … over to Catch me up
  { t: 15.8, x: 1020, y: 260, z: 1.25, d: 0.01 },     // the brief
  { t: 16.2, x: 1020, y: 250, z: 1.85, d: 1.3 },      // "but no test ran"
  { t: 19.2, x: 1180, y: 420, z: 1.45, d: 1.4 },      // decide and mark it wrong, right there
  { t: 21.2, x: 420, y: 330, z: 1.7, d: 0.01 },       // the plan map
  { t: 21.6, x: 640, y: 380, z: 1.55, d: 2.4 },
  { t: 24.4, x: 1180, y: 380, z: 1.55, d: 2.6 },
  { t: 28.8, x: 800, y: 500, z: 1.25, d: 0.01 },      // back to the wall
  { t: 29.0, x: 800, y: 500, z: 1.0, d: 2.2 },
];
// Keycaps: the key pressed, where (capture coordinates of its target), shown a-b, pressed at p.
const KEYS = [
  { a: 3.9, p: 4.6, b: 5.4, k: "1", x: 87, y: 229 },
  { a: 8.3, p: 9.0, b: 9.8, k: "D", x: 91, y: 629, amber: true },
  { a: 11.6, p: 12.3, b: 13.1, k: "⌥1", x: 138, y: 630 },
  { a: 14.9, p: 15.6, b: 16.0, k: "⌘⇧U", x: 96, y: 122 },
];
// Lower-third captions name the outcome of each step.
const CAPS = [
  { a: 0.3, b: 2.2, t: "Six Claude Code sessions. All grey." },
  { a: 2.4, b: 5.4, t: "One needs you. Answer in one key." },
  { a: 6.6, b: 9.5, t: "“Drop the old table.” It's production." },
  { a: 9.8, b: 13.1, t: "Deny. Claude comes back with a safer plan." },
  { a: 13.4, b: 15.7, t: "Claude says it's done." },
  { a: 16.0, b: 21.0, t: "Cockpit checks. No test ever ran." },
  { a: 21.6, b: 28.6, t: "Plans you read in ten seconds." },
  { a: 29.4, b: 33.8, t: "Grey and calm until something needs you." },
];
// Big headlines over the veil.
const HEADS = [{ a: 34.2, b: 39.0, l: "Less reading.", s: "Less tired.", sAt: 35.4 }];
const END = 39.0, DURATION = 45.0;

// ---------- static DOM ----------
const world = document.getElementById("world");
const imgs = {};
for (const s of [...new Set(SCENES.map((s) => s.img))]) { const i = new Image(); i.src = `shots/${s}.png`; world.appendChild(i); imgs[s] = i; }
const keyEls = KEYS.map((k) => { const d = document.createElement("div"); d.className = "key" + (k.amber ? " amber" : ""); d.textContent = k.k; document.getElementById("stage").appendChild(d); return d; });

// Chained moves: each key starts from where the previous move had reached at the key's time.
function chain(keys, t, init) {
  let start = { ...init }, result = { ...init };
  for (let i = 0; i < keys.length; i++) {
    const k = keys[i];
    if (t < k.t) break;
    const next = keys[i + 1];
    const at = (time) => { const p = spring(win(time, k.t, k.t + k.d)); const o = {}; for (const f of Object.keys(init)) o[f] = lerp(start[f], k[f], p); return o; };
    result = at(t);
    if (next && t >= next.t) start = at(next.t);
  }
  return result;
}
// 1600x1000 into the stage: 16:9 fits the height, 4:5 the width (and zooms in further to fill).
const FIT = TALL ? W / 1600 : 1.08;
function camTransform(c) {
  const z = c.z;
  const s = FIT * z, hw = W / 2 / s, hh = H / 2 / s;
  // Keep the view inside the capture: an empty band at the edge is a bug.
  const x = hw * 2 >= 1600 ? 800 : clamp(c.x, hw, 1600 - hw), y = hh * 2 >= 1000 ? 500 : clamp(c.y, hh, 1000 - hh);
  return { s, tx: W / 2 - x * s, ty: H / 2 - y * s };
}

window.seek = function (t) {
  const c = chain(CAM, t, { x: 800, y: 500, z: 1 });
  const { s, tx, ty } = camTransform(c);
  world.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
  world.style.opacity = spring(win(t, 0, 0.5));

  // scene swaps: cross-blur
  let cur = SCENES[0], prev = null;
  for (const sc of SCENES) if (t >= sc.t) { prev = cur; cur = sc; }
  const sw = win(t, cur.t, cur.t + 0.35);
  for (const [name, img] of Object.entries(imgs)) {
    let o = 0, b = 0;
    if (name === cur.img) { o = spring(sw); b = (1 - spring(sw)) * 8; }
    else if (prev && name === prev.img && sw < 1) { o = 1 - spring(sw); b = spring(sw) * 8; }
    img.style.opacity = o; img.style.filter = b > 0.05 ? `blur(${b}px)` : "none";
  }

  // Keycaps: pop in beside the target, press down on p, fade out.
  KEYS.forEach((k, i) => {
    const el = keyEls[i];
    const e = env(t, k.a, k.b, 0.3, 0.3);
    const press = t >= k.p && t < k.p + 0.22 ? 1 - Math.abs((t - k.p) / 0.11 - 1) : 0;
    el.style.opacity = t >= k.a && t < k.b ? e : 0;
    const sx = tx + k.x * s, sy = ty + k.y * s;
    el.style.transform = `translate(${sx + 40}px, ${sy - 140 + press * 8}px) scale(${lerp(0.6, 1, e)})`;
    el.style.boxShadow = press > 0.3 ? `0 ${8 - press * 8}px 0 ${k.amber ? "#b37d00" : "#9aa1a8"}, 0 10px 24px rgba(0,0,0,.4)` : "";
  });

  // Lower-third caption
  const ci = CAPS.findIndex((k) => t >= k.a && t < k.b);
  const cap = document.getElementById("cap");
  if (ci >= 0) {
    const k = CAPS[ci], e = env(t, k.a, k.b, 0.35, 0.25);
    document.getElementById("ct").textContent = k.t;
    cap.style.opacity = e; cap.style.transform = `translateY(${(1 - e) * 40}px)`;
  } else cap.style.opacity = 0;

  // Headline over a veil
  const hi = HEADS.findIndex((h) => t >= h.a && t < h.b);
  const veilOn = Math.max(0, ...HEADS.map((h) => env(t, h.a, h.b + 0.6, 0.6, 0.4)));
  document.getElementById("veil").style.opacity = 0.82 * veilOn;
  const hl = document.getElementById("hl"), hs = document.getElementById("hs");
  if (hi >= 0) {
    const h = HEADS[hi], e = env(t, h.a, h.b, 0.45, 0.3), e2 = env(t, h.sAt, h.b, 0.45, 0.3);
    hl.innerHTML = h.l; hs.innerHTML = h.s;
    hl.style.opacity = e; hl.style.transform = `translateY(${(1 - e) * 30}px)`;
    hs.style.opacity = t >= h.sAt ? e2 : 0; hs.style.transform = `translateY(${(1 - e2) * 30}px)`;
  } else { hl.style.opacity = 0; hs.style.opacity = 0; }

  const end = document.getElementById("end");
  end.style.opacity = spring(win(t, END, END + 0.6));
  [...end.children].forEach((el, i) => { const k = spring(win(t, END + 0.15 + i * 0.18, END + 0.75 + i * 0.18)); el.style.opacity = k; el.style.transform = `translateY(${(1 - k) * 24}px)`; });
};
window.seekFilm = (t) => seek(t);
window.DURATION = DURATION;
seek(Number(new URLSearchParams(location.search).get("t") ?? 0));
</script>
</body>
</html>
