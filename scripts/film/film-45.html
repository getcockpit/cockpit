<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;700&family=Atkinson+Hyperlegible+Next:wght@400;700;800&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1080px; height: 1350px; overflow: hidden; background: #0f1113; }
  * { box-sizing: border-box; }
  #stage { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(1000px 1300px at 50% 42%, #23272c 0%, #0f1113 70%); }
  .world { position: absolute; left: 0; top: 0; width: 1600px; height: 1000px; transform-origin: 0 0; }
  .world img { position: absolute; inset: 0; width: 1600px; height: 1000px; display: block; }
  #terms { position: absolute; inset: 0; }
  .pane { position: absolute; background: #0b0c0d; border: 1px solid #2a2e33; padding: 16px 18px; font: 17px/1.45 "Atkinson Hyperlegible Mono", monospace; color: #8b939b; overflow: hidden; }
  .pane .bar { position: absolute; left: 0; right: 0; top: 0; height: 28px; background: #1a1d20; font-size: 15px; white-space: nowrap; color: #6b737b; padding: 4px 12px; }
  .pane .body { position: absolute; left: 18px; right: 18px; top: 38px; bottom: 12px; overflow: hidden; white-space: nowrap; }
  .pane .ask { color: #ffb300; font-weight: 700; }
  #cursor { position: absolute; left: 0; top: 0; width: 34px; height: 34px; pointer-events: none; z-index: 20; }
  .ripple { position: absolute; border: 3px solid #ffb300; border-radius: 50%; z-index: 19; pointer-events: none; }
  #head { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; z-index: 30; pointer-events: none; }
  #head .l { font: 800 100px/1.04 "Atkinson Hyperlegible Next", sans-serif; color: #fff; letter-spacing: -0.02em; max-width: 920px; text-wrap: balance; }
  #head .s { font: 400 48px/1.25 "Atkinson Hyperlegible Next", sans-serif; color: #b8bcc4; margin-top: 22px; }
  #head .amber { color: #ffb300; }
  #cap { position: absolute; left: 50%; width: max-content; max-width: 960px; bottom: 96px; z-index: 30; display: flex; align-items: center; gap: 22px; background: #15181b; padding: 22px 34px 24px 28px; }
  #cap .dot { width: 18px; height: 18px; background: #ffb300; flex: none; }
  #cap .t { font: 700 56px/1.12 "Atkinson Hyperlegible Next", sans-serif; color: #fff; letter-spacing: -0.01em; text-wrap: balance; }
  #veil { position: absolute; inset: 0; background: #0f1113; z-index: 25; pointer-events: none; }
  #end { position: absolute; inset: 0; z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f1113; }
  #end img { width: 180px; height: 180px; }
  #end .n { font: 800 140px/1 "Atkinson Hyperlegible Next", sans-serif; color: #fff; margin-top: 26px; letter-spacing: -0.02em; }
  #end .s { font: 400 52px/1.25 "Atkinson Hyperlegible Next", sans-serif; color: #d6d9dd; margin-top: 30px; max-width: 900px; text-align: center; text-wrap: balance; }
  #end .u { font: 700 40px/1 "Atkinson Hyperlegible Mono", monospace; color: #15181b; background: #ffb300; padding: 18px 28px; margin-top: 48px; }
  #end .f { font: 400 32px/1.4 "Atkinson Hyperlegible Next", sans-serif; color: #8b939b; margin-top: 34px; max-width: 820px; text-align: center; text-wrap: balance; }
  #grid { position: absolute; inset: 0; z-index: 22; }
  #grid img { position: absolute; width: 480px; height: 300px; outline: 2px solid #2a2e33; }
</style>
</head>
<body>
<div id="stage">
  <div id="terms"></div>
  <div class="world" id="world"></div>
  <div id="grid"></div>
  <svg id="cursor" viewBox="0 0 24 24"><path d="M4 2 L4 19 L8.5 14.8 L11.6 21.6 L14.6 20.3 L11.6 13.6 L17.8 13.6 Z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg>
  <div id="veil"></div>
  <div id="head"><div class="l" id="hl"></div><div class="s" id="hs"></div></div>
  <div id="cap"><div class="dot"></div><div class="t" id="ct"></div></div>
  <div id="end"><img src="shots/icon.png"><div class="n">Cockpit</div><div class="s">Run ten Claude Code sessions. Read none of them.</div><div class="u">getcockpit.github.io</div><div class="f">Free and open source · macOS · Windows · Linux · your own Claude plan</div></div>
</div>
<script>
// ---------- time helpers: every style is computed from t; nothing carries between frames ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
// Critically damped spring step response, normalised to land exactly on 1 at p = 1.
const spring = (p, w = 7) => { p = clamp(p); const f = (x) => 1 - (1 + w * x) * Math.exp(-w * x); return f(p) / f(1); };
const lerp = (a, b, k) => a + (b - a) * k;
const win = (t, a, b) => clamp((t - a) / (b - a));
// Fade window: in over `fi`, out over `fo`.
const env = (t, a, b, fi = 0.35, fo = 0.3) => Math.min(spring(win(t, a, a + fi)), 1 - spring(win(t, b - fo, b)));

// ---------- the script ----------
// Scenes: which capture is on screen. Swaps cross-blur over 0.35 s.
const SCENES = [
  { t: 0, img: "wall" }, { t: 9.0, img: "wall-answered" },
  { t: 10.6, img: "focus" }, { t: 15.1, img: "focus-denied" },
  { t: 20.6, img: "doc" }, { t: 26.6, img: "timeline" },
  { t: 31.6, img: "review" }, { t: 34.3, img: "review-noted" },
];
// Camera moves, in capture coordinates (1600x1000 CSS px): at t, glide to centre (x, y) at zoom z over d.
const CAM = [
  // Portrait: view = (1600/z) x (2000/z) capture px, so z >= 2 fills the frame; content beats sit at z 2.2-3.6.
  // Same key times as the 16:9 master; three extra keys (33.0, 34.8) pan the wide review row.
  { t: 0, x: 800, y: 500, z: 1, d: 0.01 },
  { t: 6.2, x: 335, y: 420, z: 2.4, d: 1.1 },         // push into the first question
  { t: 9.6, x: 400, y: 500, z: 2.0, d: 0.9 },         // pull back: the queue moved on
  { t: 10.6, x: 330, y: 470, z: 2.5, d: 0.01 },       // focus: the force-push card
  { t: 11.0, x: 318, y: 470, z: 2.9, d: 1.2 },
  { t: 15.2, x: 318, y: 420, z: 2.9, d: 1.0 },        // what it changed
  { t: 17.9, x: 1425, y: 660, z: 4.4, d: 1.2 },       // the change map
  { t: 20.6, x: 235, y: 300, z: 3.4, d: 0.01 },       // doc: the goal block
  { t: 21.0, x: 420, y: 500, z: 2.0, d: 1.4 },        // pull out: two columns of blocks
  { t: 23.4, x: 1410, y: 365, z: 4.2, d: 1.8 },       // glide to "Decide first"
  { t: 26.6, x: 400, y: 455, z: 2.2, d: 0.01 },       // timeline: the sessions
  { t: 27.0, x: 1270, y: 470, z: 2.5, d: 2.0 },       // now, and who needs you next
  { t: 31.6, x: 390, y: 545, z: 2.2, d: 0.01 },       // review: the findings
  { t: 32.0, x: 390, y: 560, z: 2.3, d: 1.2 },
  { t: 33.0, x: 840, y: 520, z: 2.0, d: 1.1 },       // follow the cursor to "Note it"
  { t: 34.8, x: 850, y: 540, z: 2.1, d: 1.2 },        // noted, sent
];
// The cursor, in capture coordinates; clicks draw a ripple and press the arrow.
const CUR = [
  { t: 6.6, x: 1180, y: 700, d: 0.01 }, { t: 7.0, x: 330, y: 226, d: 1.3 },
  { t: 11.6, x: 900, y: 760, d: 0.01 }, { t: 12.4, x: 394, y: 609, d: 1.4 },
  { t: 32.4, x: 700, y: 820, d: 0.01 }, { t: 32.8, x: 1170, y: 595, d: 1.1 },
];
const CURSOR_ON = [[6.6, 9.4], [11.6, 15.3], [32.4, 35.4]];
const CLICKS = [8.6, 14.6, 34.1];
// Lower-third captions name the outcome of each step.
const CAPS = [
  { a: 6.4, b: 10.4, t: "Answer Claude in one key." },
  { a: 11.0, b: 15.0, t: "“Drop the old table.” On production." },
  { a: 15.3, b: 17.8, t: "Deny in one key. Claude finds a safer way." },
  { a: 17.9, b: 20.4, t: "Every edit, mapped by folder." },
  { a: 21.0, b: 26.4, t: "Plans you read in seconds." },
  { a: 27.0, b: 31.4, t: "Know which session needs you next." },
  { a: 32.0, b: 36.2, t: "Review PRs one finding at a time." },
];
// Big headlines (hook, turn, finale).
const HEADS = [
  { a: 0.2, b: 2.2, l: "Eight Claude Code sessions.", s: "" },
  { a: 2.2, b: 4.0, l: 'One is waiting on <span class="amber">you</span>.', s: "Which one?" },
  { a: 4.6, b: 6.2, l: "Cockpit puts it in front of you.", s: "" },
  { a: 36.6, b: 39.0, l: "Ten sessions. One screen.", s: "Every one of them, at a glance." },
];
const END = 39.0, DURATION = 44.5;

// ---------- build the static DOM ----------
const world = document.getElementById("world");
const imgs = {};
for (const s of [...new Set(SCENES.map((s) => s.img))]) { const i = new Image(); i.src = `shots/${s}.png`; world.appendChild(i); imgs[s] = i; }
const LINES = [
  "⏺ Reading src/auth/session.ts", "⏺ Update(src/app/routes.ts)", "  ⎿  Updated with 24 additions and 9 removals",
  "⏺ Bash(bun test)", "  ⎿  142 pass, 0 fail", "⏺ Searching for redirect guard…", "✻ Thinking…", "⏺ Edit(migrations/0042_sessions.sql)",
  "⏺ Bash(git diff --stat)", "  ⎿  6 files changed, 100 insertions(+), 39 deletions(-)", "⏺ Write(src/payments/charge.ts)", "⏺ Read(package.json)",
  "⏺ Bash(bun run build:all)", "  ⎿  Running in the background", "⏺ Grep(\"RateLimit\")", "  ⎿  Found 7 files", "✻ Pondering…",
];
const terms = document.getElementById("terms");
const PANES = [];
for (let i = 0; i < 8; i++) {
  const p = document.createElement("div"); p.className = "pane";
  const names = ["fix-login", "rate-limit", "deps", "csv-export", "flaky-tests", "redis", "webhooks", "onboarding"];
  p.innerHTML = `<div class="bar">claude — ~/code/shop-worktrees/${names[i]}</div><div class="body"></div>`;
  terms.appendChild(p); PANES.push(p);
}
const grid = document.getElementById("grid");
const GRID = ["wall", "focus", "doc", "timeline", "review-noted", "focus-denied"].map((s) => { const i = new Image(); i.src = `shots/${s}.png`; grid.appendChild(i); return i; });
const cursor = document.getElementById("cursor");
const ripples = CLICKS.map(() => { const r = document.createElement("div"); r.className = "ripple"; document.getElementById("stage").appendChild(r); return r; });

// ---------- seek(t): the whole frame from t ----------
function track(keys, t, init) {
  let cur = { ...init }, from = { ...init };
  for (const k of keys) {
    if (t < k.t) break;
    from = { ...cur };
    const p = spring(win(t, k.t, k.t + k.d));
    for (const f of Object.keys(init)) cur[f] = lerp(from[f], k[f], p);
    // a later key starts from where this one actually is at its start time, so moves chain smoothly
  }
  return cur;
}
// Chained version: each key starts from the value the previous move had reached at the key's time.
function chain(keys, t, init) {
  let start = { ...init };
  let result = { ...init };
  for (let i = 0; i < keys.length; i++) {
    const k = keys[i];
    if (t < k.t) break;
    const next = keys[i + 1];
    const at = (time) => { const p = spring(win(time, k.t, k.t + k.d)); const o = {}; for (const f of Object.keys(init)) o[f] = lerp(start[f], k[f], p); return o; };
    result = at(t);
    if (next && t >= next.t) start = at(next.t);
  }
  return result;
}
const FIT = 1080 / 1600; // 1600x1000 into 1080x1350: at z = 1 the full width shows (z >= 2 fills the height)
function camTransform(c) {
  const s = FIT * c.z, hw = 540 / s, hh = 675 / s;
  // Keep the view inside the capture: an empty band at the edge is a bug.
  const x = hw * 2 >= 1600 ? 800 : clamp(c.x, hw, 1600 - hw), y = hh * 2 >= 1000 ? 500 : clamp(c.y, hh, 1000 - hh);
  return { s, tx: 540 - x * s, ty: 675 - y * s };
}

window.seek = function (t) {
  // Hook: eight terminals scrolling, one quietly asking for permission.
  const hookOut = spring(win(t, 4.2, 5.4));
  const tv = 1 - win(t, 4.6, 5.6);
  terms.style.opacity = tv;
  PANES.forEach((p, i) => {
    const col = i % 2, row = Math.floor(i / 2);
    const w = 501, h = 304, gx = 30 + col * (w + 18), gy = 30 + row * (h + 18);
    const k = hookOut;
    // collapse toward the centre and shrink as the wall arrives
    const x = lerp(gx, 540 - w / 2 + (col - 0.5) * 60, k), y = lerp(gy, 675 - h / 2 + (row - 1.5) * 60, k);
    p.style.left = x + "px"; p.style.top = y + "px"; p.style.width = w + "px"; p.style.height = h + "px";
    p.style.transform = `scale(${lerp(1, 0.4, k)})`;
    const body = p.querySelector(".body");
    const n = Math.floor(t * (7 + i * 1.7)) + i * 5;
    let html = "";
    for (let j = 0; j < 17; j++) html += `<div>${LINES[(n + j) % LINES.length]}</div>`;
    if (i === 5) html = html.split("</div>").slice(0, 7).join("</div>") + `</div><div class="ask" style="opacity:${0.55 + 0.45 * Math.sin(t * 6)}">Do you want to proceed?<br>❯ 1. Yes  2. No</div>`;
    body.innerHTML = html;
  });
  // headline veil darkens the terminals behind the hook text
  const headOn = HEADS.map((h) => env(t, h.a, h.b, 0.3, 0.25));
  const anyHead = Math.max(...headOn);
  document.getElementById("veil").style.opacity = t < 4.6 ? 0.55 * anyHead : 0.6 * anyHead;
  const hi = HEADS.findIndex((h) => t >= h.a && t < h.b);
  const head = document.getElementById("head");
  if (hi >= 0) {
    const h = HEADS[hi], e = headOn[hi];
    document.getElementById("hl").innerHTML = h.l; document.getElementById("hs").innerHTML = h.s;
    head.style.opacity = e; head.style.transform = `translateY(${(1 - e) * 30}px)`; head.style.filter = `blur(${(1 - e) * 10}px)`;
  } else head.style.opacity = 0;

  // The app: the wall grows in from the collapsing terminals, then the camera directs attention.
  const appIn = spring(win(t, 4.5, 5.6));
  const c = chain(CAM, t, { x: 800, y: 500, z: 1 });
  const zoomIntro = lerp(0.55, 1, appIn);
  const { s, tx, ty } = camTransform({ ...c, z: c.z * zoomIntro });
  world.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
  world.style.opacity = appIn;
  // scene swaps: cross-blur
  let cur = SCENES[0], prev = null;
  for (const sc of SCENES) if (t >= sc.t) { prev = cur; cur = sc; }
  const sw = win(t, cur.t, cur.t + 0.35);
  for (const [name, img] of Object.entries(imgs)) {
    let o = 0, b = 0;
    if (name === cur.img) { o = spring(sw); b = (1 - spring(sw)) * 8; }
    else if (prev && name === prev.img && sw < 1) { o = 1 - spring(sw); b = spring(sw) * 8; }
    img.style.opacity = o; img.style.filter = b > 0.05 ? `blur(${b}px)` : "none";
  }

  // Cursor
  const on = CURSOR_ON.some(([a, b]) => t >= a && t < b);
  const cp = chain(CUR, t, { x: 800, y: 500 });
  const cfade = Math.max(...CURSOR_ON.map(([a, b]) => env(t, a, b, 0.25, 0.25)));
  const press = Math.max(0, ...CLICKS.map((k) => (t >= k && t < k + 0.18 ? 1 - Math.abs((t - k) / 0.09 - 1) : 0)));
  cursor.style.opacity = on ? cfade : 0;
  cursor.style.transform = `translate(${tx + cp.x * s - 6}px, ${ty + cp.y * s - 4}px) scale(${1.25 * (1 - 0.18 * press)})`;
  ripples.forEach((r, i) => {
    const k = win(t, CLICKS[i], CLICKS[i] + 0.55);
    const size = 20 + 90 * spring(k, 5);
    r.style.opacity = t >= CLICKS[i] && k < 1 ? 1 - k : 0;
    r.style.width = r.style.height = size + "px";
    r.style.left = tx + cp.x * s - size / 2 + "px"; r.style.top = ty + cp.y * s - size / 2 + "px";
  });

  // Lower-third caption
  const ci = CAPS.findIndex((k) => t >= k.a && t < k.b);
  const cap = document.getElementById("cap");
  if (ci >= 0) {
    const k = CAPS[ci], e = env(t, k.a, k.b, 0.35, 0.25);
    document.getElementById("ct").textContent = k.t;
    cap.style.opacity = e; cap.style.transform = `translate(-50%, ${(1 - e) * 40}px)`;
  } else cap.style.opacity = 0;

  // Finale: every screen tiles into a wall, then the end card.
  const g = spring(win(t, 36.4, 37.6));
  const gOut = 1 - win(t, 38.8, 39.2);
  grid.style.opacity = t >= 36.4 ? Math.min(g, gOut) : 0;
  GRID.forEach((img, i) => {
    const col = i % 2, row = Math.floor(i / 2);
    const gx = 40 + col * 520, gy = 185 + row * 340;
    img.style.left = lerp(540 - 240, gx, g) + "px"; img.style.top = lerp(675 - 150, gy, g) + "px";
    img.style.transform = `scale(${lerp(2.6, 1, g)})`;
  });
  if (t >= 36.4) world.style.opacity = Math.min(world.style.opacity, 1 - g);
  const endIn = spring(win(t, END, END + 0.6));
  const end = document.getElementById("end");
  end.style.opacity = endIn;
  [...end.children].forEach((el, i) => { const k = spring(win(t, END + 0.15 + i * 0.18, END + 0.75 + i * 0.18)); el.style.opacity = k; el.style.transform = `translateY(${(1 - k) * 24}px)`; });
};
// Pacing: the doc and timeline beats play faster than scripted so nothing sits still (film t → script t).
const WARP = [[0, 0], [21.6, 21.6], [25.2, 26.6], [29.0, 31.6], [36.4, 39.0], [40.0, 42.6]];
const warp = (f) => { for (let i = 1; i < WARP.length; i++) { const [f0, s0] = WARP[i - 1], [f1, s1] = WARP[i]; if (f <= f1) return s0 + (f - f0) * (s1 - s0) / (f1 - f0); } return f + 2.6; };
window.seekFilm = (f) => seek(warp(f));
window.DURATION = 40.0;
seek(Number(new URLSearchParams(location.search).get("t") ?? 0));
</script>
</body>
</html>
