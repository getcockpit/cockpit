name: Installer smoke test

# Installs the published release on clean machines and checks the app starts.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (default: latest)"
        required: false

permissions:
  contents: read

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  TAG: ${{ github.event.inputs.tag || github.event.release.tag_name || '' }}

jobs:
  windows:
    name: Windows (.exe and .msi)
    runs-on: windows-latest
    steps:
      - name: Download
        shell: bash
        run: gh release download $TAG -R ${{ github.repository }} -p '*_x64-setup.exe' -p '*_x64_en-US.msi' -D dl && ls -la dl
      - name: Install the setup .exe silently and start it
        shell: pwsh
        run: |
          $exe = Get-ChildItem dl -Filter *-setup.exe | Select-Object -First 1
          Start-Process $exe.FullName -ArgumentList '/S' -Wait
          $app = Get-ChildItem "$env:LOCALAPPDATA\Cockpit" -Recurse -Filter Cockpit.exe | Select-Object -First 1
          if (-not $app) { throw "Cockpit.exe not installed" }
          Get-ChildItem $app.Directory -Filter "mr-*.exe" | ForEach-Object { $_.Name }
          $p = Start-Process $app.FullName -PassThru
          Start-Sleep 15
          if ($p.HasExited) { throw "Cockpit exited early with code $($p.ExitCode)" }
          Write-Host "Cockpit is running (pid $($p.Id))"
          Stop-Process $p.Id -Force
          # Remove the per-user install so the MSI check below starts clean.
          $un = Get-ChildItem "$env:LOCALAPPDATA\Cockpit" -Filter "uninstall.exe" -Recurse | Select-Object -First 1
          if ($un) { Start-Process $un.FullName -ArgumentList '/S' -Wait }
      - name: Install the .msi silently
        shell: pwsh
        run: |
          $msi = Get-ChildItem dl -Filter *.msi | Select-Object -First 1
          $r = Start-Process msiexec -ArgumentList "/i `"$($msi.FullName)`" /qn /l*v msi.log" -Wait -PassThru
          if ($r.ExitCode -ne 0) { Get-Content msi.log -Tail 40; throw "msiexec failed: $($r.ExitCode)" }
          $dirs = @("$env:ProgramFiles", "${env:ProgramFiles(x86)}", "$env:LOCALAPPDATA\Programs") | Where-Object { $_ -and (Test-Path $_) }
          $app = Get-ChildItem $dirs -Recurse -Filter Cockpit.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notlike "$env:LOCALAPPDATA\Cockpit*" } | Select-Object -First 1
          if (-not $app) { Select-String -Path msi.log -Pattern "INSTALLDIR|APPLICATIONFOLDER|Installation success|Return value 3" | Select-Object -Last 15; throw "Cockpit.exe not found after the MSI install" }
          Write-Host "MSI installed $($app.FullName)"

  linux:
    name: Linux (.deb and AppImage)
    runs-on: ubuntu-22.04
    steps:
      - name: Download
        run: gh release download $TAG -R ${{ github.repository }} -p '*_amd64.deb' -p 'Cockpit_*_amd64.AppImage' -D dl && ls -la dl
      - name: Install the .deb and start it
        run: |
          sudo apt-get update
          sudo apt-get install -y ./dl/*_amd64.deb xvfb
          bin=$(dpkg -L cockpit | grep -iE '/bin/cockpit$' | head -1); echo "binary: $bin"; [ -n "$bin" ] || { dpkg -L cockpit | grep /bin/; exit 1; }
          set +e; timeout 15 xvfb-run -a "$bin"; code=$?; set -e
          [ "$code" = 124 ] && echo "Cockpit stayed up for 15 s" || { echo "Cockpit exited with $code"; exit 1; }
      - name: Start the AppImage
        run: |
          sudo apt-get install -y libfuse2
          chmod +x dl/*.AppImage
          set +e; timeout 15 xvfb-run -a dl/*.AppImage; code=$?; set -e
          [ "$code" = 124 ] && echo "AppImage stayed up for 15 s" || { echo "AppImage exited with $code"; exit 1; }

  macos:
    name: macOS (one-line installer)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install with site/install.sh and start it
        run: |
          COCKPIT_DEST="$RUNNER_TEMP" COCKPIT_NO_OPEN=1 bash site/install.sh
          app="$RUNNER_TEMP/Cockpit.app/Contents/MacOS/Cockpit"
          ls "$RUNNER_TEMP/Cockpit.app/Contents/MacOS"
          "$app" & pid=$!
          sleep 15
          kill -0 $pid && echo "Cockpit is running" || { echo "Cockpit exited early"; exit 1; }
          kill $pid
