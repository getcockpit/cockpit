name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: UI + sidecar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: ui
      - run: bun run test
        working-directory: ui
      - run: bun run build
        working-directory: ui
      - run: bun install --frozen-lockfile
        working-directory: sidecar
      - run: bunx tsc --noEmit -p .
        working-directory: sidecar
      - run: bun test
        working-directory: sidecar
      - run: bun test scripts/

  e2e-ui:
    name: UI end-to-end (${{ matrix.os }}, PinchTab)
    strategy:
      fail-fast: false
      matrix:
        # 22.04: 24.04's AppArmor blocks the user namespaces Chrome's sandbox needs.
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Drives the runner's preinstalled Google Chrome, headless.
      - run: npm install -g pinchtab@0.15.2
      - run: bun install --frozen-lockfile
        working-directory: ui
      - run: ./scripts/e2e-ui.sh
        env:
          MR_E2E_SHOTS: ${{ runner.temp }}/mr-e2e
      - name: Screenshots of failed flows
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ui-failures-${{ matrix.os }}
          path: ${{ runner.temp }}/mr-e2e/
          if-no-files-found: ignore

  core:
    name: Rust core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      # Git identity: tests make commits. No CRLF conversion: tests compare file contents byte for byte.
      - name: Git config for tests
        run: git config --global user.name ci && git config --global user.email ci@example.com && git config --global core.autocrlf false
      - run: ./scripts/build-helpers.sh
      - name: UI bundle (embedded by the core)
        run: bun install --frozen-lockfile && bun run build
        working-directory: ui
      - run: cargo test
        working-directory: src-tauri

  selfbuild:
    name: Self-build (macOS)
    # The app builds itself from this checkout and relaunches into the new build (no Claude).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # The self-build runs `cargo tauri build`.
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2
      - run: ./scripts/selftest-selfbuild.sh
