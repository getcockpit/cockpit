[package]
name = "remote-push"
version = "0.1.0"
edition = "2024"
description = "Cockpit Remote (D46): Web Push from each Mac with its own VAPID keys, no push server of ours"
publish = false

[dependencies]
web-push-native = "0.5"
base64ct = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
http = "1"
