[package]
name = "remote-web"
version = "0.1.0"
edition = "2024"
description = "Cockpit Remote in the browser (D46): remote-link for the installable web app, via wasm-bindgen"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
remote-link = { path = "../remote-link" }
iroh = "=1.4.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros"] }
n0-future = "0.3"
data-encoding = "2"
console_error_panic_hook = "0.1"

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
