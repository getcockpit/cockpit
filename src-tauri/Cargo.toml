[package]
name = "cockpit"
version = "0.1.1"
description = "Cockpit: a visual front-end for Claude Code"
authors = ["Cockpit contributors"]
edition = "2024"
license = "MIT"
repository = "https://github.com/getcockpit/cockpit"
homepage = "https://getcockpit.github.io/"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cockpit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Capitalised: unbundled dev builds show the executable name in the Dock and menu bar.
[[bin]]
name = "Cockpit"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
ulid = "3"
regex = "1"
dirs = "7"
portable-pty = "0.9"
ureq = { version = "3", features = ["json"] }
rusqlite = { version = "0.37", features = ["bundled"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"
