[package]
name = "cockpit"
version = "0.1.1"
description = "Cockpit: a visual front-end for Claude Code"
authors = ["Cockpit contributors"]
edition = "2024"
license = "MIT"
repository = "https://github.com/getcockpit/cockpit"
homepage = "https://getcockpit.github.io/"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cockpit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Capitalised: unbundled dev builds show the executable name in the Dock and menu bar.
[[bin]]
name = "Cockpit"
path = "src/main.rs"

[dev-dependencies]
# Passkey proofs in remote.rs tests: WebAuthn-shaped assertions from a test key.
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
ulid = "1"
regex = "1"
dirs = "7"
portable-pty = "0.9"
ureq = { version = "3", features = ["json"] }
rusqlite = { version = "0.37", features = ["bundled"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }  # no "zip": updates ship as raw .exe/.AppImage, and zip 4.x has open advisories
tauri-plugin-autostart = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Cockpit Remote (phone <-> Mac, no server of ours): QUIC dialed by public key, hole punching, E2E relay fallback.
iroh = "=1.4.1"
remote-link = { path = "../crates/remote-link" }
remote-push = { path = "../crates/remote-push" }
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "time", "io-util"] }
hmac = "0.12"
sha2 = "0.10"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
getrandom = "0.3"
data-encoding = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Signals a check's process group directly: procps `kill -9 -<pgid>` on Ubuntu 22.04 signals every process.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"

# The OS keychain off macOS (macOS goes through `security`): Credential Manager, the kernel keyring.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }
